# The site on GitHub Pages, put together each time (Pages takes the whole site at once):
#   /           the home page, from master; its buttons give the release's and the beta's versions
#   /app/       the web version of the latest release, built from its release-* tag
#   /beta/app/  the beta: master's web version (scripts/build-web.sh --beta: Varstotas Beta, its
#               preferences and data folder apart from the release's); /beta/ leads there
# Called by Publish release (publish.yml) after a release; nightly when master has changed since
# the site was last put together here; by hand (Actions → Web site → Run workflow) any time, for
# instance to put out the home page between releases. The release's app gets master's offline
# worker (scripts/web-worker.sh): the release's own may clear the beta's caches.
# The github-pages environment allows the master branch and release-* tags.
name: Web site

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  plan:
    name: What to build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      master: ${{ steps.plan.outputs.master }}
      go: ${{ steps.plan.outputs.go }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: plan
        run: |
          tag="$(gh release view --json tagName --jq .tagName)"
          master="$(gh api "repos/$GH_REPO/commits/master" --jq .sha)"
          go=true
          # nightly: only when master has changed since the last site put together by this workflow
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            last="$(gh run list --workflow pages.yml --status success --limit 1 --json headSha --jq '.[0].headSha // empty')"
            [[ "$last" == "$master" ]] && go=false
          fi
          echo "Release $tag, master ${master::7}, build: $go"
          { echo "tag=$tag"; echo "master=$master"; echo "go=$go"; } >> "$GITHUB_OUTPUT"

  release:
    name: Release's web version
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.master }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
          path: release
      - uses: ./.github/actions/web-tools
        with:
          dir: release
      - name: Build
        working-directory: release
        run: scripts/build-web.sh
      # the app is in app/ since the home page came (after 0.3.0: the whole build then); the
      # offline worker only where the app's page has one (since the PWA, after 0.3.0 too)
      - name: Offline worker
        run: |
          app=release/target/web/app
          [[ -d "$app" ]] || app=release/target/web
          [[ -f "$app/sw.js" ]] && scripts/web-worker.sh "$app"
          echo "APP=$app" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: release-app
          path: ${{ env.APP }}
          if-no-files-found: error
          retention-days: 3

  beta:
    name: Beta (master)
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.master }}
      - uses: ./.github/actions/web-tools
      - name: Build
        run: scripts/build-web.sh --beta
      - uses: actions/upload-artifact@v4
        with:
          name: beta-app
          path: target/web-beta/app
          if-no-files-found: error
          retention-days: 3

  pages:
    name: GitHub Pages
    needs: [plan, release, beta]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.master }}
      - name: Home page
        run: |
          export WEB_VERSION="${TAG#release-}"
          BETA_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          export BETA_VERSION
          scripts/build-web.sh --site
      - uses: actions/download-artifact@v4
        with:
          name: release-app
          path: target/web/app
      - uses: actions/download-artifact@v4
        with:
          name: beta-app
          path: target/web/beta/app
      - name: The beta's address
        run: printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=app/"><title>Varstotas Beta</title><a href="app/">Varstotas Beta</a>\n' > target/web/beta/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Summary
        run: echo "[Site]($PAGE_URL) — app/ from $TAG, beta/app/ from master ${MASTER::7}" >> "$GITHUB_STEP_SUMMARY"
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          MASTER: ${{ needs.plan.outputs.master }}
