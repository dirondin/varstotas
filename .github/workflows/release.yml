# A release-* tag: version check, unit tests and release builds on macOS, Windows and Linux; the
# packages (macOS .dmg + .zip, Windows installer + .zip, Linux .AppImage + .tar.gz) and their
# SHA256SUMS.txt are kept as the run's `release-files` artifact. Nothing is published here:
# Actions → Publish release, run from the tag, publishes exactly these files (publish.yml).
# A tag pushed in the same push that first adds this file does not start it; build such a tag
# with Actions → Release build → Run workflow, choosing the tag under "Use workflow from".
name: Release build

on:
  push:
    tags: ['release-*']
  # run from a release-* tag ("Use workflow from"), so the run belongs to the tag's commit
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # no debug info in test builds: smaller target/ (runner disk) and faster links
  CARGO_PROFILE_DEV_DEBUG: 0
  TAG: ${{ github.ref_name }}

jobs:
  check:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || "$TAG" != release-* ]]; then
            echo "::error::Run this workflow from a release-* tag, not $GITHUB_REF_TYPE $TAG"
            exit 1
          fi
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [[ "${TAG#release-}" != "$cargo_version" ]]; then
            echo "::error::Tag $TAG does not match the workspace version $cargo_version in Cargo.toml (expected release-$cargo_version)"
            exit 1
          fi
          echo "Varstotas $cargo_version"

  build:
    name: ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            build: scripts/build-macos.sh
            # the target the package build uses, so it reuses what the tests compiled
            # (the x86_64 half of the universal app is built on its own)
            test_target: aarch64-apple-darwin
          - name: Windows
            os: windows-latest
            build: scripts/build-windows.sh --native
            test_target: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-22.04
            build: scripts/build-linux.sh
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Version from the tag
        run: echo "VARSTOTAS_VERSION=${TAG#release-}" >> "$GITHUB_ENV"
      - name: System packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev zip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests (release profile)
        # The same optimised code that is packaged; dependencies compiled here are reused by the
        # package build below. Debug-profile tests (debug assertions, overflow checks) run in CI.
        run: cargo test --workspace --locked --release --no-fail-fast ${{ matrix.test_target && format('--target {0}', matrix.test_target) || '' }}
      - name: Build and package
        run: ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: varstotas-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  bundle:
    name: Release files
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: varstotas-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error
