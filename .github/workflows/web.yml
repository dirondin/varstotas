# The web build: scripts/build-web.sh makes the static site, tests/web/smoke.mjs checks it in
# headless Chrome (WebGPU on SwiftShader: the runner has no GPU). Called by Release build
# (release.yml) for a release-* tag; the site is kept as the run's `web-site` artifact, which
# Publish release puts on GitHub Pages (pages.yml). Run by hand to try a branch.
name: Web build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  web:
    name: Web build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tools
        run: |
          # wasm-bindgen-cli must match the wasm-bindgen crate in Cargo.lock
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/wasm-bindgen-$v-x86_64-unknown-linux-musl.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-$v-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_123/bin" >> "$GITHUB_PATH"
      - name: Clippy
        run: cargo clippy -p varstotas_app --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build
        run: scripts/build-web.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test
        run: node tests/web/smoke.mjs target/web target/web-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-smoke
          path: target/web-smoke
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: web-site
          path: target/web
          if-no-files-found: error
