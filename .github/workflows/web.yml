# The web build: scripts/build-web.sh makes the static site, tests/web/smoke.mjs checks it in
# headless Chrome (WebGPU on SwiftShader: the runner has no GPU). Called by Release build
# (release.yml) for a release-* tag; the site is kept as the run's `web-site` artifact, which
# Publish release puts on GitHub Pages (pages.yml). Run by hand to try a branch.
name: Web build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  web:
    name: Web build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/web-tools
      - name: Clippy
        run: cargo clippy -p varstotas_app --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build
        run: scripts/build-web.sh
      # kept even when the smoke test fails (the run fails, so Publish release does not take it)
      - uses: actions/upload-artifact@v4
        with:
          name: web-site
          path: target/web
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test
        run: node tests/web/smoke.mjs target/web target/web-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-smoke
          path: target/web-smoke
          if-no-files-found: ignore
