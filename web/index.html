<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varstotas</title>
<link rel="icon" href="icon.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2d31; color: #e6e6e6; font: 15px system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; outline: none; }
  .note { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  .note div { max-width: 32em; line-height: 1.5; }
  .note[hidden] { display: none; }
  a { color: #8ab4f8; }
</style>
</head>
<body>
<canvas id="varstotas"></canvas>
<div class="note" id="loading"><div>Loading Varstotas…</div></div>
<div class="note" id="no-webgpu" hidden><div>
  <b>This browser has no WebGPU.</b><br>
  Varstotas in the browser needs WebGPU: a recent Chrome or Edge, Safari 26 or later,
  or Firefox on Windows. The desktop version runs everywhere:
  <a href="https://github.com/dirondin/varstotas/releases">download it</a>.
</div></div>
<script type="module">
  const loading = document.getElementById("loading");
  if (!navigator.gpu || !(await navigator.gpu.requestAdapter().catch(() => null))) {
    loading.hidden = true;
    document.getElementById("no-webgpu").hidden = false;
  } else {
    const app = await import("./varstotas.js");
    await app.default();
    loading.hidden = true;
  }
</script>
</body>
</html>
