<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- the page runs under the notch and the home bar; the app keeps its controls clear of them -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2d31">
<!-- added to the home screen: a full-screen app, no browser bars -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Varstotas">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Varstotas</title>
<link rel="icon" href="icons/icon-192.png">
<style>
  /* the safe area, read by the app (ui/compact.rs) */
  :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px); --safe-right: env(safe-area-inset-right, 0px); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2d31; color: #e6e6e6; font: 15px system-ui, sans-serif; }
  /* the fingers are the app's: no page zoom, scroll or pull-to-refresh over it */
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; outline: none; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .note { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  .note div { max-width: 32em; line-height: 1.5; }
  .note[hidden] { display: none; }
  a { color: #8ab4f8; }
</style>
</head>
<body>
<canvas id="varstotas"></canvas>
<div class="note" id="loading"><div>Loading Varstotas…</div></div>
<div class="note" id="no-webgpu" hidden><div>
  <b>This browser has no WebGPU.</b><br>
  Varstotas in the browser needs WebGPU: a recent Chrome or Edge, Safari 26 or later,
  or Firefox on Windows. The desktop version runs everywhere:
  <a href="https://github.com/dirondin/varstotas/releases">download it</a>.
</div></div>
<script type="module">
  // the offline worker (sw.js): the app opens without the network once it was here
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  const loading = document.getElementById("loading");
  if (!navigator.gpu || !(await navigator.gpu.requestAdapter().catch(() => null))) {
    loading.hidden = true;
    document.getElementById("no-webgpu").hidden = false;
  } else {
    const app = await import("./varstotas.js");
    await app.default();
    loading.hidden = true;
  }
</script>
</body>
</html>
