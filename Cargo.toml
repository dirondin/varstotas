[workspace]
resolver = "3"
members = ["crates/varstotas_kernel", "crates/varstotas_render", "crates/varstotas_script", "crates/varstotas_app"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
glam = { version = "0.34", features = ["serde"] }
slotmap = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
egui = "0.36"
egui-wgpu = "0.36"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
rfd = "0.17"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr", "tga", "bmp"] }

varstotas_kernel = { path = "crates/varstotas_kernel" }
varstotas_render = { path = "crates/varstotas_render" }
varstotas_script = { path = "crates/varstotas_script" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Vendored with a local fix, see vendor/egui_code_editor/VARSTOTAS.md.
[patch.crates-io]
egui_code_editor = { path = "vendor/egui_code_editor" }
