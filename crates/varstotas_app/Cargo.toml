[package]
name = "varstotas_app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "varstotas"
path = "src/main.rs"

[dependencies]
web-time.workspace = true
varstotas_i18n = { workspace = true }
varstotas_kernel.workspace = true
varstotas_render.workspace = true
varstotas_script.workspace = true
varstotas_physics.workspace = true
glam.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
eframe.workspace = true
rfd.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
# Online Materials: ambientCG ships zip archives (already in the dependency tree).
flate2 = "1"
# 3D Text: glyph outlines of egui's bundled fonts (both are already in egui's dependency tree).
skrifa = "0.44"
epaint_default_fonts = "0.36"
# Script Console editor: highlighting, line numbers, completion (egui 0.36).
egui_code_editor = { version = "0.4.2", default-features = false, features = ["egui", "editor"] }
toml = "1"
getrandom = "0.4"
# Files, folders and links in the system's default program (ShellExecute, open, xdg-open / gio,
# the OpenURI portal in a Flatpak) instead of a program path the user enters.

# macOS: scripted runs start as a background app (no activation, no Dock icon); the same
# winit as eframe's.
[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

# The log window's local time (localtime_r).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows-only: embeds icon + version info into varstotas.exe (see build.rs).
[build-dependencies]
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
open = "5"

# The web build: randomness from the browser's crypto.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlInputElement", "HtmlAnchorElement", "File", "FileList", "Blob", "Url", "BeforeUnloadEvent", "Event", "EventTarget"] }
