[package]
name = "varstotas_app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "varstotas"
path = "src/main.rs"

[dependencies]
varstotas_kernel.workspace = true
varstotas_render.workspace = true
varstotas_script.workspace = true
glam.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
eframe.workspace = true
rfd.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
# 3D Text: glyph outlines of egui's bundled fonts (both are already in egui's dependency tree).
skrifa = "0.44"
epaint_default_fonts = "0.36"

# Windows-only: embeds icon + version info into varstotas.exe (see build.rs).
[build-dependencies]
winresource = "0.1"
